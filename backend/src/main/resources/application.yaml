server:
  port: 8080

spring:
  application:
    name: nexusMarket

  # Relational store: every aggregate except the audit trail.
  datasource:
    url: jdbc:mysql://localhost:3306/nexusmarket_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  # Audit store: AuditLog only. Boot 4 rejects the old spring.data.mongodb.* connection keys.
  mongodb:
    uri: mongodb://localhost:27017/nexusmarket_audit

nexusmarket:
  jwt:
    # Local development secret only; HMAC-SHA needs at least 256 bits.
    secret: 3f8a1c6e9b2d4f7a0c5e8b1d3f6a9c2e5b8d1f4a7c0e3b6d9f2a5c8e1b4d7f0a
    expiration-ms: 3600000
  payment:
    # No financial provider is named by the specification; the gateway is simulated.
    simulated-outcome: APPROVED
